[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvp-exam-app"
version = "0.1.0"
description = "FastAPI — API pública/BFF del generador de exámenes"
requires-python = ">=3.11"
dependencies = [
    "mvp-core",
    "mvp-agents-backend",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
mvp-core = { path = "../../libs/core", editable = true }
mvp-agents-backend = { path = "../agents-backend", editable = true }
